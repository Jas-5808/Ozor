<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OZAR — onlayn do'kon. Smartfonlar, elektronika va maishiy texnika. O'zbekiston bo'ylab tez yetkazib berish." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ozar.uz/" />
    <title>Ozar</title>
    
    <!-- DNS prefetch для внешних ресурсов -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://images.uzum.uz">
    <link rel="dns-prefetch" href="https://api.ozar.uz">
    <link rel="dns-prefetch" href="https://lab.ozar.uz">
    
    <!-- Preconnect для критических ресурсов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://lab.ozar.uz" crossorigin>
    
    <!-- Неблокирующая загрузка шрифтов (снимает render-blocking) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
    </noscript>
    
    <!-- Основные ресурсы подтянет Vite (modulepreload/ESM). Дополнительный preload убран, чтобы избежать ворнингов. -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
